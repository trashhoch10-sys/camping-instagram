name: Daily Camping Post

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testlauf ohne Veröffentlichung (1 = ja)"
        default: "0"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py
      - name: Bild ins Repo pushen
        run: |
          git config user.name "camping-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images history.json post.json
          git commit -m "Post $(date +%F)" || echo "nichts zu committen"
          git push
      - run: python publish.py
